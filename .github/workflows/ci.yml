name: WarmWhisper v2 — CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend regression tests (Phase 1 safety net) ────────────────────────
  backend-tests:
    name: Backend Safety Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Chat-Bot/Database

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Chat-Bot/Database/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run safety regression tests
        run: npm test
        env:
          # No real DB needed for unit tests — they use mock logic
          MONGODB_URI: 'mongodb://localhost:27017/test-placeholder'
          MAG_ENABLED: 'false'
          NODE_ENV: 'test'

  # ── Frontend tests ────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Chat-Bot/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Chat-Bot/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
          REACT_APP_EMAILJS_SERVICE_ID: 'test-service'
          REACT_APP_EMAILJS_TEMPLATE_ID: 'test-template'
          REACT_APP_EMAILJS_PUBLIC_KEY: 'test-key'
          REACT_APP_BACKEND_URL: 'http://localhost:5000'
          REACT_APP_RASA_URL: 'http://localhost:5005'
          REACT_APP_MAG_ENABLED: 'false'

  # ── Security check ────────────────────────────────────────────────────────
  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in .env files
        run: |
          if grep -r "MONGODB_URI=mongodb+srv://.*:.*@" . --include="*.env" 2>/dev/null; then
            echo "❌ REAL MongoDB credentials found committed!"
            exit 1
          fi
          echo "✅ No committed credentials detected"

      - name: Check .gitignore covers .env
        run: |
          if ! grep -q "\.env" .gitignore; then
            echo "❌ .gitignore does not cover .env files!"
            exit 1
          fi
          echo "✅ .gitignore covers .env"
