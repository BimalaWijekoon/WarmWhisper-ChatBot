# The config recipe.
recipe: default.v1

# The assistant project unique identifier
assistant_id: 20241215-165931-juvenile-shine

# Configuration for Rasa NLU.
language: en

pipeline:
  # Tokenization with intent split support
  - name: WhitespaceTokenizer
    intent_tokenization_flag: true
    intent_split_symbol: ","
  
  # Feature extraction components
  - name: RegexFeaturizer
  
  - name: LexicalSyntacticFeaturizer
  
  # Vector feature extraction
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 3  # Trigram support for context
  
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 3
    max_ngram: 5  # Character-level n-grams for variation handling
  
  # Advanced intent classification
  - name: DIETClassifier
    epochs: 150
    entity_recognition: true
    intent_classification: true
    threshold: 0.65
  
  # Fallback mechanism
  - name: FallbackClassifier
    threshold: 0.5  # Captures uncertain inputs

policies:
  # Memorization for exact matches
  - name: MemoizationPolicy
  
  # Rule-based policy with emotion detection fallback
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_detect_emotion"
  
  # Contextual tracking policy
  - name: TEDPolicy
    max_history: 5
    epochs: 100