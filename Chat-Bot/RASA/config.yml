# The config recipe.
# https://rasa.com/docs/rasa/model-configuration/
recipe: default.v1

# The assistant project unique identifier
# This default value must be replaced with a unique assistant name within your deployment
assistant_id: 20241215-165931-juvenile-shine

# Configuration for Rasa NLU.
# https://rasa.com/docs/rasa/nlu/components/
language: en

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2  # Bigram features for better context understanding
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 3
    max_ngram: 5  # Character-level n-grams for typo tolerance
  - name: DIETClassifier
    epochs: 100
    entity_recognition: true
    intent_classification: true
    threshold: 0.7  # Balanced threshold for intent detection
  - name: FallbackClassifier
    threshold: 0.6  # Adjusted fallback threshold for better user experience

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_detect_emotion"
  - name: TEDPolicy
    max_history: 5
    epochs: 100
