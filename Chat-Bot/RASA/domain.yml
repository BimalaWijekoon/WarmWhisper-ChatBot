version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny

responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_goodbye:
  - text: "Bye! Take care!"

  utter_happy:
  - text: "Great, carry on!"

actions:
  - action_detect_emotion  # Handles emotion detection dynamically
  - action_cheer_up        # Provides encouragement dynamically
  - action_check_if_helped # Checks if the user needs additional help

slots:
  emotion_detected:
    type: bool
    influence_conversation: false
    mappings:  # Optional in your case, unless you use it for automatic filling via actions
      - type: from_text

  context:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text  # You can map the context from user messages, or leave it to actions


session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
