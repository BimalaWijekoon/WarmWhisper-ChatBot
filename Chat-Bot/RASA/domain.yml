version: "3.1"

intents:
  - greet
  - bye
  - feelings
  - deny
  - affirm
  - emotions
  - greet,bye
  - nlu_fallback  # Added for handling fallback situations
  - bye,greet
  - greet,feeling
  - greet,emotions
  - emotions,bye
  - feelings,emotions

responses:
  utter_greet:
    - text: "Hello! How can I help you today?"
    - text: "Hi there! Nice to meet you."
    - text: "Hey! Welcome back."

  utter_bye:
    - text: "Goodbye! Have a great day."
    - text: "See you later! Take care."
    - text: "Bye! Looking forward to our next chat."

  utter_feelings_reply:
    - text: "I'm doing well, thanks for asking! How about you?"
    - text: "I'm having a good day. Hope you are too!"
    - text: "Thanks for asking - I'm functioning perfectly."

  utter_affirm_reply:
    - text: "Great! Let's proceed."
    - text: "Perfect, I understand."
    - text: "Excellent, we're on the same page."

  utter_deny_reply:
    - text: "No problem, let me know what you need instead."
    - text: "That's fine, we can try something else."
    - text: "Okay, let's look at other options."

  utter_emotions_empathy:
    - text: "I understand how you're feeling. It's completely normal to experience {emotion}."
    - text: "Thank you for sharing your emotions with me. It's important to acknowledge how we feel."
    - text: "I hear you. {emotion} can be quite intense."

  utter_greet_bye:
    - text: "Hi there! Oh, are you leaving already? Take care!"
    - text: "Hello and goodbye! Have a wonderful day ahead."
    - text: "Hi! Sorry to see you go so soon. Bye!"

  utter_bye_greet:
    - text: "Goodbye and hello again! Make up your mind! 😊"
    - text: "Leaving and coming back? I'm happy either way!"
    - text: "Both bye and hi? I'm here whenever you need me."

  utter_greet_feelings:
    - text: "Hello! I'm glad you're asking how I'm feeling. I'm doing great!"
    - text: "Hi there! Thanks for your concern about my feelings. I'm functioning well!"
    - text: "Hey! How thoughtful of you to ask about my feelings. I'm doing fine!"

  utter_greet_emotions:
    - text: "Hi! I appreciate you sharing your emotions with me. Would you like to talk more about it?"
    - text: "Hello! Thank you for opening up about how you're feeling. I'm here to listen."
    - text: "Hey! It's brave of you to express your emotions. Let's talk about it."

  utter_emotions_bye:
    - text: "I understand you're feeling {emotion}. Hope you feel better!"
    - text: "I acknowledge your feelings. Take good care of yourself!"

  utter_feelings_emotions:
    - text: "While I'm doing fine, I notice you're feeling {emotion}. Would you like to talk about it?"
    - text: "I'm well, thank you. I see you're experiencing some emotions - I'm here to listen."
    - text: "Thanks for asking about me. More importantly, how are you coping with these feelings?"

actions:
  - action_detect_emotion

slots:
  fallback_triggered:
    type: bool
    initial_value: False
    mappings:
      - type: from_intent
        intent: nlu_fallback
        value: true

  emotion:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
        conditions:
          - active_loop: null
        accepted_values:
          - admiration
          - amusement
          - anger
          - annoyance
          - approval
          - caring
          - confusion
          - curiosity
          - desire
          - disappointment
          - disapproval
          - disgust
          - embarrassment
          - excitement
          - fear
          - gratitude
          - grief
          - joy
          - love
          - nervousness
          - optimism
          - pride
          - realization
          - relief
          - remorse
          - sadness
          - surprise
          - neutral


session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
