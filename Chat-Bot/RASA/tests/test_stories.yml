#### WarmWhisper v2 — RASA Regression Test Stories
#### Tests match the actual domain.yml intents and actions.
#### Run with: rasa test

stories:

# ── Core intent flows ────────────────────────────────────────────────────────

- story: test greeting flow
  steps:
  - user: |
      Hello there!
    intent: greet
  - action: action_process_message
  - action: utter_greet

- story: test goodbye flow
  steps:
  - user: |
      Goodbye
    intent: bye
  - action: utter_bye

- story: test feelings inquiry flow
  steps:
  - user: |
      How are you feeling today?
    intent: feelings
  - action: utter_feelings_reply

- story: test affirmation flow
  steps:
  - user: |
      Yes, that sounds good
    intent: affirm
  - action: utter_affirm_reply

- story: test denial flow
  steps:
  - user: |
      No, not really
    intent: deny
  - action: utter_deny_reply

# ── Emotion detection flows ───────────────────────────────────────────────────

- story: test emotion detection flow
  steps:
  - user: |
      I'm feeling really anxious and scared
    intent: emotions
  - action: action_detect_emotion
  - action: action_respond_to_emotion

- story: test fallback emotion detection
  steps:
  - user: |
      I've been struggling so much lately with everything going on
    intent: nlu_fallback
  - action: action_detect_emotion
  - action: action_respond_to_emotion

# ── Multi-intent compound flows ───────────────────────────────────────────────

- story: test greet and bye compound
  steps:
  - user: |
      Hi, bye
    intent: greet,bye
  - action: utter_greet_bye

- story: test bye and greet compound
  steps:
  - user: |
      Goodbye, hello
    intent: bye,greet
  - action: utter_bye_greet

- story: test greet and feelings compound
  steps:
  - user: |
      Hi, how are you feeling?
    intent: greet,feelings
  - action: utter_greet_feelings

- story: test greet and emotions compound
  steps:
  - user: |
      Hello, I'm feeling very sad today
    intent: greet,emotions
  - action: utter_greet
  - action: action_detect_emotion
  - action: action_respond_to_emotion

- story: test emotions and bye compound
  steps:
  - user: |
      I feel hopeless, goodbye
    intent: emotions,bye
  - action: action_detect_emotion
  - action: utter_emotions_bye

- story: test feelings and emotions compound
  steps:
  - user: |
      How are you feeling?, I'm feeling overwhelmed
    intent: feelings,emotions
  - action: action_detect_emotion
  - action: utter_feelings_emotions

# ── Full conversation flow ────────────────────────────────────────────────────

- story: test full session - greet, emotion, bye
  steps:
  - user: |
      Hi there!
    intent: greet
  - action: action_process_message
  - action: utter_greet
  - user: |
      I'm feeling really depressed and alone
    intent: nlu_fallback
  - action: action_detect_emotion
  - action: action_respond_to_emotion
  - user: |
      Thank you, bye
    intent: bye
  - action: utter_bye
