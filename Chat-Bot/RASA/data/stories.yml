version: "3.1"

stories:
  # Single Intent Stories
  - story: simple_greeting
    steps:
    - intent: greet
    - action: action_process_message
    - action: utter_greet

  - story: simple_goodbye
    steps:
    - intent: bye
    - action: utter_bye

  - story: simple_feelings
    steps:
    - intent: feelings
    - action: utter_feelings_reply

  - story: simple_affirmation
    steps:
    - intent: affirm
    - action: utter_affirm_reply

  - story: simple_denial
    steps:
    - intent: deny
    - action: utter_deny_reply

  - story: simple_emotions
    steps:
    - intent: emotions
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen

  # Multiple Intent Stories
  - story: greet_and_bye
    steps:
    - intent: greet,bye
    - action: utter_greet_bye

  - story: bye_and_greet
    steps:
    - intent: bye,greet
    - action: utter_bye_greet

  - story: greet_and_feelings
    steps:
    - intent: greet,feeling
    - action: utter_greet_feelings

  - story: greet_and_emotions
    steps:
    - intent: greet,emotions
    - action: utter_greet
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen

  - story: emotions_and_bye
    steps:
    - intent: emotions,bye
    - action: action_detect_emotion
    - action: utter_emotions_bye
    - action: action_listen

  - story: feelings_and_emotions
    steps:
    - intent: feelings,emotions
    - action: action_detect_emotion
    - action: utter_feelings_emotions
    - action: action_listen

  # Fallback Stories
  - story: fallback_emotion_detection
    steps:
    - intent: nlu_fallback
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen

  - story: greet_emotion_bye
    steps:
    - intent: greet
    - action: action_process_message
    - action: utter_greet
    - intent: nlu_fallback
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen
    - intent: bye
    - action: utter_bye

  # New Extended Stories
  - story: greeting_affirmation_goodbye
    steps:
    - intent: greet
    - action: action_process_message
    - action: utter_greet
    - intent: affirm
    - action: utter_affirm_reply
    - intent: bye
    - action: utter_bye

  - story: feelings_denial_emotions
    steps:
    - intent: feelings
    - action: utter_feelings_reply
    - intent: deny
    - action: utter_deny_reply
    - intent: emotions
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen

  - story: greet_emotions_fallback
    steps:
    - intent: greet
    - action: action_process_message
    - action: utter_greet
    - intent: emotions
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen
    - intent: nlu_fallback
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen

  - story: multiple_greetings
    steps:
    - intent: greet
    - action: action_process_message
    - action: utter_greet
    - intent: greet
    - action: action_process_message
    - action: utter_greet

  - story: greeting_feelings_bye
    steps:
    - intent: greet
    - action: action_process_message
    - action: utter_greet
    - intent: feelings
    - action: utter_feelings_reply
    - intent: bye
    - action: utter_bye

  - story: emotions_with_fallback
    steps:
    - intent: emotions
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen
    - intent: nlu_fallback
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen

  - story: full_interaction_flow
    steps:
    - intent: greet
    - action: action_process_message
    - action: utter_greet
    - intent: feelings
    - action: utter_feelings_reply
    - intent: affirm
    - action: utter_affirm_reply
    - intent: emotions
    - action: action_detect_emotion
    - action: action_respond_to_emotion
    - action: action_listen
    - intent: bye
    - action: utter_bye