version: "3.1"

stories:

# happy path: greet -> mood_great
- story: happy path
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_great
  - action: utter_happy

# sad path 1: greet -> mood_unhappy -> cheer_up -> did_that_help -> affirm
- story: sad path 1
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - slot_was_set:
    - emotion_detected: False
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: affirm
  - action: utter_happy


# sad path 2: greet -> mood_little_happy -> cheer_up -> did_that_help -> deny
- story: sad path 2
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: deny
  - action: utter_goodbye

# greet, mood_unhappy, and emotion detection
- story: greet, mood_unhappy, and emotion detection
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - slot_was_set:
    - emotion_detected: True
  - action: action_detect_emotion


# handle greeting then fallback (emotion detection)
- story: handle_greet_then_fallback
  steps:
  - intent: greet
  - action: utter_greet
  - intent: nlu_fallback
  - action: action_detect_emotion

# handle fallback then greeting (emotion detection then greet)
- story: handle_fallback_then_greet
  steps:
  - intent: nlu_fallback
  - action: action_detect_emotion
  - intent: greet
  - action: utter_greet

# fallback and handle emotion after greet
- story: fallback_after_greet
  steps:
  - intent: greet
  - action: utter_greet
  - intent: nlu_fallback
  - action: action_detect_emotion

# greet, then emotion, then goodbye
- story: greet_then_emotion_then_goodbye
  steps:
  - intent: greet
  - action: utter_greet
  - intent: nlu_fallback
  - action: action_detect_emotion
  - intent: goodbye
  - action: utter_goodbye

# greet then goodbye
- story: greet_then_goodbye
  steps:
  - intent: greet
  - action: utter_greet
  - intent: goodbye
  - action: utter_goodbye

# emotion, then greet, then goodbye
- story: emotion_then_greet_then_goodbye
  steps:
  - intent: nlu_fallback
  - action: action_detect_emotion
  - intent: greet
  - action: utter_greet
  - intent: goodbye
  - action: utter_goodbye

# emotion, then goodbye
- story: emotion_then_goodbye
  steps:
  - intent: nlu_fallback
  - action: action_detect_emotion
  - intent: goodbye
  - action: utter_goodbye

# greet then emotion then goodbye
- story: greet_emotion_goodbye
  steps:
  - intent: greet
  - action: utter_greet
  - intent: nlu_fallback
  - action: action_detect_emotion
  - intent: goodbye
  - action: utter_goodbye

# greet, mood_little_happy, and affirm together
- story: greet, mood_little_happy, and affirm together
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_little_happy
  - action: action_detect_emotion
  - intent: affirm
  - action: utter_happy

# mood_great, greet, and goodbye together
- story: mood_great, greet, and goodbye together
  steps:
  - intent: mood_great
  - action: utter_happy
  - intent: greet
  - action: utter_greet
  - intent: goodbye
  - action: utter_goodbye

# mood_unhappy, deny, and goodbye together
- story: mood_unhappy, deny, and goodbye together
  steps:
  - intent: mood_unhappy
  - action: action_detect_emotion
  - intent: deny
  - action: utter_did_that_help
  - intent: goodbye
  - action: utter_goodbye

# mood_great, affirm, and goodbye together
- story: mood_great, affirm, and goodbye together
  steps:
  - intent: mood_great
  - action: utter_happy
  - intent: affirm
  - action: utter_happy
  - intent: goodbye
  - action: utter_goodbye
