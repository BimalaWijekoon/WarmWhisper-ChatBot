version: "3.1"

rules:

# Rule to handle goodbye anytime the user says goodbye
# This ensures that the bot can always respond with a goodbye message, regardless of the context.
- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

# Rule to handle user challenges about the bot's identity
# When the user questions whether the bot is a bot, it responds with a predefined message.
- rule: Respond to user challenge about being a bot
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

# Rule to handle fallback cases with emotion detection
# This is triggered when the NLU confidence is low or no intent is matched. 
# The bot tries to detect the user's emotion and then waits for the next input.
- rule: Handle fallback with emotion detection
  condition:
    # Ensure this only triggers when no form or loop is active
    - active_loop: null
  steps:
  - intent: nlu_fallback
  - action: action_detect_emotion
  - action: action_listen  # Allow the bot to listen for the next input

# Rule to handle emotion detection in isolation
# This rule detects the user's emotion and then listens for further input.
- rule: Handle emotion detection and continue
  steps:
  - action: action_detect_emotion
  - action: action_listen  # Allows the bot to listen for the next user input

# Rule to handle greetings after fallback
# If the user greets the bot after a fallback, the bot responds with a greeting message.
- rule: Handle greetings after fallback
  steps:
  - intent: greet
  - action: utter_greet

# Rule to handle goodbyes after fallback
# If the user says goodbye after a fallback, the bot responds with a goodbye message.
- rule: Handle goodbyes after fallback
  steps:
  - intent: goodbye
  - action: utter_goodbye

# Rule to handle a greeting followed by emotion detection
# This ensures the bot greets the user first, detects their emotion on fallback, and then proceeds.
- rule: Greet before emotion detection
  steps:
  - intent: greet
  - action: utter_greet
  - intent: nlu_fallback
  - action: action_detect_emotion
