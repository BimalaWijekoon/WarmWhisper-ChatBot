version: "3.1"

rules:
  # Mandatory emotion detection rules
  - rule: Handle fallback with emotion detection
    condition:
      - active_loop: null
    steps:
      - intent: nlu_fallback
      - action: action_detect_emotion
      - action: action_respond_to_emotion
      - action: action_listen

  - rule: Handle emotion detection and continue
    steps:
      - action: action_detect_emotion
      - action: action_listen

  # Basic greeting rule
  - rule: Respond to greeting
    steps:
      - intent: greet
      - action: action_process_message
      - action: utter_greet

  # Goodbye rule
  - rule: Say goodbye
    steps:
      - intent: bye
      - action: utter_bye

  # Feelings inquiry rule
  - rule: Respond to feelings question
    steps:
      - intent: feelings
      - action: utter_feelings_reply

  # Affirmation rule
  - rule: Handle affirmation
    steps:
      - intent: affirm
      - action: utter_affirm_reply

  # Denial rule
  - rule: Handle denial
    steps:
      - intent: deny
      - action: utter_deny_reply

  # Emotions rule
  - rule: Handle emotions
    steps:
      - intent: emotions
      - action: action_detect_emotion
      - action: action_respond_to_emotion
      - action: action_listen

  # Combined intent rules
  - rule: Handle greet and bye combination
    steps:
      - intent: greet,bye
      - action: utter_greet_bye

  - rule: Handle bye and greet combination
    steps:
      - intent: bye,greet
      - action: utter_bye_greet

  - rule: Handle greet and feelings combination
    steps:
      - intent: greet,feelings
      - action: utter_greet_feelings

  - rule: Handle greet and emotions combination
    steps:
      - intent: greet,emotions
      - action: utter_greet
      - action: action_detect_emotion
      - action: action_respond_to_emotion
      - action: action_listen

  - rule: Handle emotions and bye combination
    steps:
      - intent: emotions,bye
      - action: action_detect_emotion
      - action: utter_emotions_bye
      - action: action_listen

  - rule: Handle feelings and emotions combination
    steps:
      - intent: feelings,emotions
      - action: action_detect_emotion
      - action: utter_feelings_emotions
      - action: action_listen